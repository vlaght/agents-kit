name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  adapters-in-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
      - name: Verify generated agent adapters match roles
        run: python3 scripts/sync_agents.py --check
